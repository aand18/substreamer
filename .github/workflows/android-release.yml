name: Android APK build

# Builds a debug-signed release APK (arm64-v8a only) on GitHub's runners.
# The RN/Expo template signs the release variant with the debug keystore by
# default (EAS overrides this for store builds), so the artifact installs
# directly — but its signature differs from the Play build, so uninstall
# the store app before installing it.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or branch to build (e.g. v8.1.9)'
        required: true
        default: 'master'
  push:
    tags: ['v*']

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - run: npm ci

      - run: npx expo prebuild -p android --clean

      # Side-by-side install: distinct applicationId + launcher label so this
      # build coexists with the Play Store app instead of replacing it.
      - name: Make side-by-side variant
        run: |
          sed -i "/release {/a\\            applicationIdSuffix '.unofficial'" android/app/build.gradle
          sed -i 's|<string name="app_name">substreamer</string>|<string name="app_name">substreamer Unofficial</string>|' android/app/src/main/res/values/strings.xml
          grep -A2 "release {" android/app/build.gradle | head -3
          grep app_name android/app/src/main/res/values/strings.xml

      - run: cd android && ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: substreamer-arm64-v8a-release
          path: android/app/build/outputs/apk/release/app-release.apk
